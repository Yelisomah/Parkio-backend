spring.application.name=parkio
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parkio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Admin seed ────────────────────────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:admin@parkio.com}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}
app.admin.first-name=${ADMIN_FIRST_NAME:Super}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}

# ── Email (SMTP) ──────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@parkio.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Frontend URL ──────────────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ── Payment ───────────────────────────────────────────────────────────────────
app.payment.gateway=${PAYMENT_GATEWAY:simulated}
app.payment.currency=${PAYMENT_CURRENCY:GHS}
app.payment.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.payment.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}

# ── Redis (token blacklist; future home for booking-slot distributed locks) ──
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
app.token-blacklist.store=${TOKEN_BLACKLIST_STORE:memory}

# ── Booking scheduling ────────────────────────────────────────────────────────
app.booking.no-show-grace-minutes=${NO_SHOW_GRACE_MINUTES:30}
app.booking.reminder-minutes-before=${REMINDER_MINUTES_BEFORE:60}
app.notification.retention-days=${NOTIFICATION_RETENTION_DAYS:90}

# ── Distributed slot locking (tech-standards.md non-negotiable for prod) ─────
# Off by default — local dev / CI has no Redis running. application-prod.properties turns it on.
app.booking.distributed-lock.enabled=${BOOKING_LOCK_ENABLED:false}
app.booking.distributed-lock.ttl-seconds=${BOOKING_LOCK_TTL_SECONDS:10}

# ── Organizations & Staff (Kiro Phase B) ──────────────────────────────────────
app.staff.shift-no-show-grace-minutes=${SHIFT_NO_SHOW_GRACE_MINUTES:20}

# ── Collections reconciliation (Kiro Phase E) ─────────────────────────────────
app.collections.discrepancy-threshold-percent=${COLLECTIONS_DISCREPANCY_THRESHOLD_PERCENT:20}
app.collections.trailing-window-days=${COLLECTIONS_TRAILING_WINDOW_DAYS:14}

# ── Guest checkout OTP (Kiro Phase 2, QR-signage guest checkout) ─────────────
# dev-mode returns the OTP in the API response regardless of whether SMS
# delivery (below) is configured or succeeded — MUST be false in any real
# deployment, once app.sms.provider is actually set to a real provider.
app.otp.ttl-minutes=${OTP_TTL_MINUTES:5}
app.otp.dev-mode=${OTP_DEV_MODE:true}

# ── SMS delivery ──────────────────────────────────────────────────────────────
# "none" (default) = no-op, logs only. "hubtel" = real delivery via Hubtel's
# SMS API (see HubtelSmsGateway) — the standard path for Ghana-market SMS
# without separate agreements with each telco.
app.sms.provider=${SMS_PROVIDER:none}
app.sms.hubtel.client-id=${HUBTEL_SMS_CLIENT_ID:}
app.sms.hubtel.client-secret=${HUBTEL_SMS_CLIENT_SECRET:}
app.sms.hubtel.sender-id=${HUBTEL_SMS_SENDER_ID:Parkio}

# ── Logging (correlation ID via RequestLoggingFilter + MDC) ───────────────────
logging.pattern.level=%5p [%X{correlationId:-}]

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Parkio Backend
info.app.version=1.0.0