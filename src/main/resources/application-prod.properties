# ── Prod profile — strict settings, no DDL, Swagger off ──────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

logging.level.root=WARN
logging.level.com.example.parkio=INFO

# Swagger off in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Actuator — expose only health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multi-instance deployment needs the shared Redis-backed blacklist
app.token-blacklist.store=redis

# Real deployment = multiple replicas behind a load balancer → the distributed
# slot lock is required, per tech-standards.md's non-negotiable.
app.booking.distributed-lock.enabled=true

# A real SMS provider now exists (HubtelSmsGateway) but is OFF by default
# (app.sms.provider=none) until credentials are actually configured below.
# app.otp.dev-mode MUST flip to false only once app.sms.provider=hubtel AND
# real Hubtel credentials are set — left true here still, deliberately, as a
# loud reminder rather than a silent footgun: flipping it to false while SMS
# is still "none" means guests/registrants never receive their OTP at all
# and the whole flow breaks silently.
app.otp.dev-mode=true

# Set these three (and app.sms.provider=hubtel above the app.sms line in the
# base application.properties, or override SMS_PROVIDER=hubtel here) to
# actually enable SMS delivery:
# app.sms.provider=hubtel
# app.sms.hubtel.client-id=${HUBTEL_SMS_CLIENT_ID}
# app.sms.hubtel.client-secret=${HUBTEL_SMS_CLIENT_SECRET}
# app.sms.hubtel.sender-id=${HUBTEL_SMS_SENDER_ID:Parkio}
