# ── Test profile: in-memory H2 database ──────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:parkio_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false

# H2 in-memory schema is generated by Hibernate for tests — Flyway (Postgres SQL) stays off here
spring.flyway.enabled=false

# In-memory token blacklist for tests — no Redis dependency needed
app.token-blacklist.store=memory

# Shorter JWT TTL for tests
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=3600000
app.jwt.refresh-expiration=7200000

app.admin.email=admin@test.com
app.admin.password=Test@1234
app.admin.first-name=Test
app.admin.last-name=Admin

# Suppress Swagger in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Disable mail in tests
spring.mail.host=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

app.frontend.url=http://localhost:3000
